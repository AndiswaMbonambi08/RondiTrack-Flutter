include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

plugins:
  riverpod_lint: 3.1.9

linter:
  rules:
    # Reason: this is an application, not a published package; API docs on
    # every public member add noise without a reader. Disabled on purpose.
    public_member_api_docs: false
