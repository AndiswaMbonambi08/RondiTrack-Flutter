name: ronditrack
description: "RondiTrack mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'

dependencies:
  drift: 2.35.3
  drift_flutter: 0.3.1
  shared_preferences: 2.5.6
  intl: 0.20.3
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  freezed_annotation: 3.1.0
  go_router: 18.1.1
  json_annotation: 4.12.0
  retrofit: 4.10.0
  riverpod_annotation: 4.0.7
  sentry_flutter: 10.3.0

dev_dependencies:
  drift_dev: 2.35.2
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  go_router_builder: 4.5.2
  json_serializable: 6.15.2
  retrofit_generator: 10.3.3
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  swagger_parser: 1.45.1
  very_good_analysis: 11.0.0
  mocktail: 1.0.5
  alchemist: 0.14.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

# Each package is held at the newest version that was at least 14 days old on
# 2026-11-23. Remove a line on its date, run pub get, then run
# tool/check_lock_age.ps1. The date is the day after the newest version
# turns 14 days old.
dependency_overrides:
  cli_util: 0.6.0 # remove on 2026-12-05 (0.6.1 is from 2026-11-20)
  jni: 1.1.2 # remove on 2026-12-04 (1.2.1 is from 2026-11-19)
  jni_flutter: 1.0.4+1 # remove on 2026-12-03 (1.1.0 is from 2026-11-18)
  material_ui: 1.10.0 # remove on 2026-12-01 (1.11.1 is from 2026-11-16)
  objective_c: 9.6.3 # remove on 2026-11-26 (9.6.4 is from 2026-11-11)
  shared_preferences_android: 2.5.4 # remove on 2026-11-26 (2.5.5 is from 2026-11-11)
  shared_preferences_foundation: 2.6.1 # remove on 2026-11-26 (2.6.2 is from 2026-11-11)
  sqlite3: 3.9.1 # remove on 2026-12-07 (3.9.2 is from 2026-11-22)